<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Card</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="glass-card">

    <img id="profileImage" class="profile-img" src="profile.jpg">

    <h2 id="name">Loading...</h2>
    <p id="phone"></p>

    <div class="buttons">

        <a id="whatsapp" class="btn">WhatsApp</a>

        <a id="mail" class="btn">Email</a>

        <a id="instagram" class="btn">Instagram</a>

    </div>

    <button class="add-contact" onclick="addContact()">
        Add Contact
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
