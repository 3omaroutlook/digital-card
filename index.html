<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Omar Kamal - Digital Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
    <h2>Loading...</h2>
</div>

<!-- Main Content -->
<div id="content" class="hidden">

    <div class="card">

        <img class="logo" src="logo.png" alt="Logo">

        <div class="profile-container">
            <img class="avatar" src="profile.jpg" alt="Profile">
            <div class="name-phone">
                <h2 id="name"></h2>
                <p id="phone"></p>
            </div>
        </div>

        <a id="whatsapp" class="btn">WhatsApp</a>
        <a id="email" class="btn">Mail</a>
        <a id="instagram" class="btn">Instagram</a>
        <a id="saveContact" class="btn">Add Contact</a>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
