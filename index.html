<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <img class="profile" id="profileImage" src="" alt="Profile">
    <div class="name" id="name"></div>
    <div class="phone" id="phone"></div>

    <div class="links">
        <a class="btn" id="whatsapp">WhatsApp</a>
        <a class="btn" id="email">Email</a>
        <a class="btn" id="instagram">Instagram</a>
    </div>
</div>

<button class="add-contact" onclick="addContact()">+</button>

<script src="script.js"></script>
</body>
</html>
