<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Omar Kamal - Digital Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
    <h2>Loading...</h2>
</div>

<!-- Main Content -->
<div id="content" class="hidden">

    <div class="card">

        <img id="companyLogo" class="logo" src="logo.png">

        <img id="profileImg" class="avatar" src="profile.jpg">

        <h2 id="name"></h2>
        <p id="title">Digital Business Card</p>

        <div class="links">
            <a id="phone" class="btn">Call Now</a>
            <a id="whatsapp" class="btn">WhatsApp</a>
            <a id="email" class="btn">Mail</a>
            <a id="instagram" class="btn">Instagram</a>
            <a id="saveContact" class="btn">Save Contact</a>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
