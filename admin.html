<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
</head>
<body>
<h2>Admin Panel</h2>
<form id="userForm">
  <input type="text" id="userKey" placeholder="Username" required/><br/>
  <input type="text" id="name" placeholder="Full Name" required/><br/>
  <input type="text" id="phone" placeholder="Phone"/><br/>
  <input type="email" id="email" placeholder="Email"/><br/>
  <input type="text" id="instagram" placeholder="Instagram"/><br/>
  <input type="text" id="whatsapp" placeholder="WhatsApp"/><br/>
  <input type="text" id="image" placeholder="Profile Image URL"/><br/>
  <button type="submit">Add / Update User</button>
</form>
<script src="admin.js"></script>
</body>
</html>
